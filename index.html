
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Concluído!</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, sans-serif;
            background: #f7f8fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #171717;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 460px;
            padding: 50px 35px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.05);
        }

        .success-icon {
            width: 76px;
            height: 76px;
            background: #e8f8ee;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
        }

        .success-icon svg {
            width: 38px;
            height: 38px;
            stroke: #16a34a;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            font-size: 27px;
            font-weight: 700;
            margin-bottom: 13px;
            letter-spacing: -0.7px;
        }

        .description {
            font-size: 15px;
            color: #737373;
            line-height: 1.7;
        }

        .email-info {
            margin-top: 28px;
            padding: 17px;
            background: #f7f8fa;
            border-radius: 10px;
            font-size: 14px;
            color: #525252;
            line-height: 1.6;
        }

        .email-info strong {
            color: #262626;
        }

        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #a3a3a3;
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 24px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="success-icon">
            <svg viewBox="0 0 24 24">
                <path d="M5 12.5L10 17L19 7"/>
            </svg>
        </div>

        <h1>Obrigado pela sua compra!</h1>

        <p class="description">
            Seu pedido foi concluído com sucesso.
            Agradecemos pela confiança!
        </p>

        <div class="email-info">
            Para mais informações sobre seu pedido,
            <strong>confira seu e-mail.</strong>
            Enviaremos todas as atualizações por lá.
        </div>

        <div class="footer">
            Obrigado por comprar conosco!
        </div>

    </main>

</body>
</html>
